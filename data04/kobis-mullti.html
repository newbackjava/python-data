<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>KOBIS axios 예제</title>

    <!-- axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <button id="b1">불러오기</button>

    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {

            document.getElementById('b1').addEventListener('click', function () {

                axios.get(
                    "https://www.kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json",
                    {
                        params: {
                            key: "6d67fa164c41539d5695302942e640be",
                            targetDt: "20230722"
                        }
                    }
                )
                .then(function (response) {
                    // 1) 전체 json 확인
                    const json = response.data;
                    console.log(json);

                    // 2) 영화 목록 배열 꺼내기
                    const list = json.boxOfficeResult.dailyBoxOfficeList;

                    // 3) 리스트 길이만큼 반복
                    for (let i = 0; i < list.length; i++) {
                        const item = list[i];   // i번째 영화

                        const movieNm = item.movieNm; // 영화 제목
                        const scrnCnt = item.scrnCnt; // 상영관 수
                        const openDt  = item.openDt;  // 개봉일
                        const rank    = item.rank;    // 박스오피스 순위

                        // 콘솔에 한 줄씩 출력
                        console.log(
                            `${rank}위: ${movieNm} / 상영관: ${scrnCnt} / 개봉일: ${openDt}`
                        );
                    }

                    // 필요하면 alert로도 보여주기 (옵션)
                    /*
                    let msg = "";
                    for (let i = 0; i < list.length; i++) {
                        const item = list[i];
                        msg += `${item.rank}위 : ${item.movieNm} (개봉일: ${item.openDt})\n`;
                    }
                    alert(msg);
                    */
                })
                .catch(function (error) {
                    console.error(error);
                    alert("오류");
                });

            });

        });
    </script>
</body>
</html>
