<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>일별 박스오피스 (axios)</title>

    <!-- axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        body {
            background-color: pink;   /* 화면 핑크색 배경 (스크린샷 느낌) */
            font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
        }
        #result {
            margin-top: 10px;
            white-space: pre-line;   /* \n 줄바꿈 그대로 표시 */
        }
    </style>
</head>
<body>
    <h3>일별 박스오피스</h3>
    <button id="b1">불러오기</button>

    <!-- 여기 안에 영화 목록 출력 -->
    <div id="result"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const btn    = document.getElementById('b1');
            const result = document.getElementById('result');

            btn.addEventListener('click', function () {

                axios.get(
                    "https://www.kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json",
                    {
                        params: {
                            key: "6d67fa164c41539d5695302942e640be",
                            targetDt: "20230722"
                        }
                    }
                )
                .then(function (response) {
                    const json  = response.data;
                    const list  = json.boxOfficeResult.dailyBoxOfficeList;

                    console.log(json);   // 콘솔 확인용

                    // 1) 결과 영역 초기화
                    let output = "";

                    // 2) 리스트를 돌면서 문자열 만들기
                    for (let i = 0; i < list.length; i++) {
                        const item = list[i];

                        const movieNm = item.movieNm;   // 영화 제목
                        const audiCnt = item.audiCnt;   // 해당일 관객수(or scrnCnt로 바꿔도 됨)
                        const openDt  = item.openDt;    // 개봉일

                        // 예) 미션 임파서블: 데드 레코닝 PART ONE 1616 2023-07-12
                        output += `${movieNm} ${audiCnt} ${openDt}\n`;
                    }

                    // 3) 문자열을 브라우저에 출력
                    result.textContent = output;   // 또는 innerHTML + <br> 사용 가능
                })
                .catch(function (error) {
                    console.error(error);
                    alert("오류");
                });

            });

        });
    </script>
</body>
</html>
