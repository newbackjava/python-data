<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>영화 리뷰 감성 분석기</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <!-- axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Bootstrap 5 JS (선택사항) -->
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous">
    </script>
    <!-- CSS 최소화 -->
    <style>
        body {
            padding: 20px;
        }
        .result-area {
            min-height: 60px;
            background-color: #f5f5f5;
            color: red;
        }
    </style>
</head>

<body>
<div class="container mt-3">
    <h1 class="h4 mb-3">영화 리뷰 감성 분석기</h1>

    <!-- 입력 폼 -->
    <div class="mb-3">
        <label for="reviewInput" class="form-label">리뷰 입력</label>
        <textarea style="background: yellow;"
                id="reviewInput"
                class="form-control"
                rows="2"
        >완전 재미있었어요! 또 보고 싶을 정도로 최고였습니다 😊</textarea>
    </div>

    <!-- 버튼 (로딩 영역 제거) -->
    <div class="d-flex align-items-center gap-3 mb-3">
        <button id="analyzeBtn" class="btn btn-primary">
            감성 분석하기
        </button>
    </div>

    <!-- 결과 영역 -->
    <h2 class="h6 mb-2">분석 결과</h2>
    <div id="resultArea" class="result-area badge-light">
        <p id="resultMessage" class="mb-1 text-muted">
            아직 분석 결과가 없습니다. 위에 리뷰를 입력하고 버튼을 눌러 주세요.
        </p>
        <div  style="background: lime; height: 200px; width: 100%;">
            <span id="resultBadge" style="background: red; height: 100px; width: 100%; color: white;"></span>
        </div>
    </div>
</div>



<script>
const analyzeBtn    = document.getElementById("analyzeBtn");
const reviewInput   = document.getElementById("reviewInput");
const resultMessage = document.getElementById("resultMessage");
const resultBadge   = document.getElementById("resultBadge");

analyzeBtn.addEventListener("click", async () => {
    const text = reviewInput.value.trim();
    console.log(text);

    try {
        // axios로 GET 요청
        //const encoded = encodeURIComponent(text);
        await axios.get("/ai/" + text).then((response) => {
            const data = response.data;  // { result: "긍정 감성" } 형태라고 가정
            console.log(data);
            resultMessage.textContent = "입력한 문장: " + text;
            resultBadge.innerHTML = data.result.title + "<br><img width=700 height=450 src=" + data.result.poster_url + ">";
        });
    } catch (error) {
        console.error(error);
        resultMessage.textContent = "요청 실패";
    }
});
</script>

</body>
</html>
