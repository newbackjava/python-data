<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>영화 리뷰 감성 분석기</title>

    <!-- Bootstrap 5 CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
    >
    <!-- axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Bootstrap 5 JS (선택사항) -->
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous">
    </script>
    <!-- ✅ CSS 최소화 -->
    <style>
        body {
            padding: 20px;
        }
        .result-area {
            min-height: 60px;
            background-color: #f5f5f5;
            color: red;
        }
    </style>
</head>
<body>
<div class="container mt-3">
    <h1 class="h4 mb-3">영화 리뷰 감성 분석기</h1>

    <!-- 입력 폼 -->
    <div class="mb-3">
        <label for="reviewInput" class="form-label">리뷰 입력</label>
        <textarea style="background: yellow;"
                  id="reviewInput"
                  class="form-control"
                  rows="2"
        >완전 재미있었어요! 또 보고 싶을 정도로 최고였습니다 😊</textarea>
    </div>
    <!-- 파란버튼   -->
    <!-- 버튼 (로딩 영역 제거) -->
    <div class="d-flex align-items-center gap-3 mb-3">
        <button id="analyzeBtn" class="btn btn-primary">
            감성 분석하기
        </button>
    </div>
    <!-- 결과화면   -->
    <h2 class="h6 mb-2">분석 결과</h2>
    <div id="resultArea" class="result-area badge-light">
        <p id="resultMessage" class="mb-1 text-muted">
            아직 분석 결과가 없습니다. 위에 리뷰를 입력하고 버튼을 눌러 주세요.
        </p>
        <div style="background: lime; height: 200px; width: 100%;">
            <span id="resultBadge" style="background: red; height: 100px; width: 100%; color: white;"></span>
        </div>
    </div>
</div>

<script>

    //dom tree에서 해당 id를 가진 태그까지 찾음.
    const analyzeBtn = document.getElementById("analyzeBtn")
    const reviewInput = document.getElementById("reviewInput")
    const resultMessage = document.getElementById("resultMessage")
    const resultBadge = document.getElementById("resultBadge")

    //버튼을 클릭했을 때 입력한 댓글을 가지고 와라.!
    //버튼에 클릭기능 추가해야함.
    //analyzeBtn.addEventListener("click", 실행하는함수);
    //실행하는 함수로 한번 쓰고 버릴 익명함수를 많이 씀.
    //익명함수를 더 간단하게 하는 화살표함수를 많이 씀.
    //analyzeBtn.addEventListener("click", () => { alert("클릭했음");})
    analyzeBtn.addEventListener("click", () => {
           //클릭했을 때 입력값가지고 와야함.
           const text = reviewInput.value.trim() //양쪽 공백 제거
           alert(text)

    //가지고 온 댓글을 axios로 서버로 전달하면서 요청
    //axios.get('요청주소/전달할데이터').then(응답을받으면처리할함수)
    //@app.get("/ai/{reply}")
    axios.get('/ai/' + text).then((response) => {
    //http의 body안에 전달된 데이터를 꺼낼때는 response.data
        //alert("ai응답받음>> " + response.data.result)
        //console.log(response.data)
        console.log(response.data.result)
        resultMessage.innerHTML = response.data.result.title
        resultBadge.innerHTML = "<img src=" + response.data.result.poster_url + ">"
    })
    //axios가 성공하면 json을 받아올 예정임.
    //json을 result부분에 넣어주자.
    })


</script>
</body>
</html>
